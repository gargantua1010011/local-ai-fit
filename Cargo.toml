[package]
name = "local-ai-fit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PC 사양을 확인해 돌릴 수 있는 로컬 AI 모델을 보여준다"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
opt-level = "s"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
